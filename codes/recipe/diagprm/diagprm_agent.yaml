- name: diagprm_interaction
  _target_: recipe.diagprm.diagprm_agent_loop.DiagPRMAgentLoop
  max_turns: 10
  verifier_enabled: true
  # Clean main setting: Doctor cannot observe the oracle KG.
  # Set true only for KG-tool ablations.
  kg_tool_enabled: false
  # Patient simulator LLM API (OpenAI-compatible)
  # Can also be set via environment variables: PATIENT_API_BASE, PATIENT_MODEL, PATIENT_API_KEY
  # LongCat API（无需代理，集群直接可访问）
  # API Key 通过环境变量 PATIENT_API_KEY 传入，避免硬编码
  patient_api_base: "https://api.longcat.chat/openai/v1"
  patient_model: "LongCat-2.0-Preview"
  patient_max_tokens: 256
  # 关闭思考模式：patient agent 不需要 CoT，节省 token 和延迟
  patient_enable_thinking: false
